# Kampanjprofil: [NORDICS] Blizzard - World of Warcraft Forever (Clipping Culture, via Content Rewards)
# Reglerna är avskrivna från kampanjen 13 november 2026 (ClippingAlpha get_campaign, kl. 18 UTC).
# Kontrollera mot kampanjsidan om något har ändrats.
# Id:t är blizzard_nordics, eftersom appen bara tillåter a-z, siffror och _ i kampanjens id.

name: blizzard_nordics
streamer: Blizzard Entertainment
campaign: "[NORDICS] Blizzard - World of Warcraft Forever (Clipping Culture)"
language: en

# clipsmiths inställningar: ingen Twitch-kanal, ingen facecam, mitten av bilden blir 9:16.
# Kör:  clipsmith process <fil.mp4> --config config.blizzard_nordics.yaml
clipsmith_config: config.blizzard_nordics.yaml

preferred_games: [World of Warcraft]

source:
  allowed: "Bara Blizzards eget material: trailers, gameplay, paneler och filer i kampanjens innehållsmapp. Filer utan tal är tillåtna."
  banned:
    - Streams, även Blizzards egna och streamers
    - Andras innehåll och orelaterade virala klipp

clip:
  min_seconds: 11    # kampanjen kräver längre än 10 s
  max_seconds: 45    # eget val, kampanjen anger inget tak

formats:
  - id: world_reveal
    name: World reveal
    description: Show the world and its zones. Sweeping shots of cities, landscapes and new areas. Open on the most striking view.
  - id: epic_moment
    name: Epic moment
    description: Combat, bosses and magic. Big spells, clashes and boss reveals. Start right before the hit and end on the payoff.
  - id: cinematic_beat
    name: Cinematic beat
    description: One scene from a trailer with a clear start and end, like a line, a reveal or a confrontation. Never cut mid-scene.

on_screen_text:
  text: ""
  required: false    # kampanjen kräver ingen text på bilden
  position: top
  font_size: 46
  font_file: null

overlay:
  file: null
  required: false    # ingen overlay i kampanjen
  mode: full

facecam:
  required: false    # Blizzards material har ingen facecam

safe_zone:
  top: 0.07
  bottom: 0.20

caption:
  starts_with: "#ad #blizzardpartner"   # kampanjens krav: #ad först, #blizzardpartner direkt efter
  must_include:
    - "#ad"
    - "#blizzardpartner"
    - "@warcraft"                       # tagga @warcraft på TikTok och YouTube
  hashtags: ["#worldofwarcraft", "#warcraft", "#wow"]
  game_hashtag: true
  template: "{title} @warcraft"

audio:
  lufs: -14

platforms: [tiktok, youtube_shorts]

payment:
  cpm_usd: 4.00
  min_views: 250     # minst 250 visningar för betalning

approval: >
  Skicka in klippen via Content Rewards. Bara visningar från Sverige, Danmark, Norge och
  Finland räknas.

other_rules:
  - Posta på engelska
  - Samma video får postas högst 5 gånger
  - Bara visningar från SE, DK, NO och FI räknas

links:
  content_rewards: "https://contentrewards.com/c/campaigns/c21c887c-5a8a-4891-a5b9-c094f7f1a689"
  analytics_form: null
