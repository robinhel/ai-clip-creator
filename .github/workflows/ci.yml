name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm gitleaks.tgz
      # Scans the checked-out files with .gitleaks.toml. History is not scanned here:
      # old commits still hold a known secret until the history is rewritten.
      - run: gitleaks dir . --redact --no-banner --exit-code 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" mypy
      - run: ruff check src tests campaign tests_campaign
      - run: mypy src

  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,server,vision]" -r requirements-campaign.txt
      - run: mkdir -p work
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./work/ci_test.db
      - run: python -m pytest tests/ -q
      - run: python -m pytest tests_campaign -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip setuptools
      - run: pip install -e ".[dev]"
      - run: bandit -r src/ -ll -x tests/
      # PYSEC-2026-89: markdown 3.10.2 — transitive dep via mkdocs (dev only, no fix available yet)
      - run: pip-audit --skip-editable --ignore-vuln PYSEC-2026-89
