title = "ai-clip-creator gitleaks config"

# Keep all of gitleaks' default rules.
[extend]
useDefault = true

# Only clearly fake values used as placeholders in tests. Never add a real key here:
# remove it from the code and rotate it instead.
[[allowlists]]
description = "Fake key values in the test suite"
regexTarget = "secret"
regexes = [
  '''^zyxwvutsrq9876543210ponmlkjihg$''',  # tests_campaign/test_keys.py: the alphabet backwards
  '''^(hemligt-varde|secret-value)-123$''',  # tests_campaign/test_rekommendation.py
]

# Built locally and ignored by git: Next.js build output, installed packages and the Python environment.
# They hold third-party code and test keys that are not ours. `gitleaks dir` scans them unless they are listed here.
[[allowlists]]
description = "Paths that git ignores and that are built locally"
paths = [
  '''(^|/)web/\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
]
