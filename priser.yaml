# Pris i dollar per miljon tokens.
# Hämtat 2026-11-11 från https://platform.claude.com/docs/en/about-claude/pricing
# Priser ändras. Kontrollera sidan ibland och uppdatera här.

models:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write: 2.50
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    over_100k:          # gäller när hela prompten är över 100 000 tokens
      input: 0.50
      output: 2.50
      cache_read: 0.05
      cache_write: 0.625

# En modell som inte står ovan räknas dyrt, så att spärren hellre stoppar för tidigt.
default:
  input: 8.00
  output: 40.00

# Transkribering via Berget: dollar per minut ljud.
# Berget tar 1,98 euro per 1 000 minuter (docs.berget.ai/models/overview, november 2026).
# Budgeten räknas i dollar. Här räknas 1 euro som 1,10 dollar, avrundat uppåt.
# En modell som inte står här räknas som 0, eftersom priset inte är känt.
transcription:
  Systran/faster-whisper-large-v3: 0.0022
